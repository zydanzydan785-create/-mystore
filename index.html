<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجهيز معلومات الكرت</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .payment-card {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .bank-logos {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        .bank-logos img {
            height: 30px;
            object-fit: contain;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="payment-card">
    <div class="bank-logos">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" alt="Visa">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="MasterCard">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Mada_Logo.svg" alt="mada">
    </div>

    <form>
        <div class="input-group">
            <label>رقم البطاقة</label>
            <input type="text" placeholder="**** **** **** ****" maxlength="19">
        </div>
        <div class="input-group">
            <label>تاريخ الانتهاء</label>
            <input type="text" id="expiry" placeholder="MM/YY" maxlength="5">
        </div>
        <div class="input-group">
            <label>رمز التحقق (CVV)</label>
            <input type="text" placeholder="***" maxlength="3">
        </div>
        <button type="submit">تأكيد الدفع</button>
    </form>
</div>

<script>
    // تنسيق التاريخ تلقائياً ليظهر (/) بعد أول رقمين
    const expiryInput = document.getElementById('expiry');
    expiryInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 2) {
            e.target.value = value.substring(0, 2) + '/' + value.substring(2, 4);
        } else {
            e.target.value = value;
        }
    });
</script>

</body>
</html>
