<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام عملية الشراء</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .header h2 { font-size: 18px; margin: 0; flex-grow: 1; text-align: center; }
        
        .section-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #333; }
        
        .input-group { margin-bottom: 25px; position: relative; border-bottom: 1px solid #ddd; }
        .input-group label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; }
        
        .input-wrapper { display: flex; align-items: center; }
        input {
            width: 100%;
            border: none;
            padding: 10px 0;
            font-size: 17px;
            outline: none;
            background: transparent;
        }

        /* شعار البطاقة داخل الخانة */
        #card-logo {
            width: 40px;
            height: 25px;
            object-fit: contain;
            margin-left: 10px;
            display: none; /* يظهر فقط عند التعرف على الكرت */
        }

        .row { display: flex; gap: 20px; }
        .row .input-group { flex: 1; }

        .security-note {
            font-size: 13px;
            color: #888;
            line-height: 1.5;
            margin-top: 30px;
            text-align: center;
            background: #fdfdfd;
            padding: 10px;
        }
        
        .footer-logos {
            text-align: left;
            margin-bottom: 10px;
        }
        .footer-logos img { height: 15px; margin-right: 5px; filter: grayscale(1); opacity: 0.6; }

        button {
            width: 100%;
            padding: 15px;
            background: #000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>&lt;</span>
        <h2>إتمام عملية الشراء</h2>
    </div>

    <div class="section-title">بطاقة ائتمان/خصم</div>
    
    <div class="footer-logos">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Mada_Logo.svg">
    </div>

    <form>
        <div class="input-group">
            <label>رقم البطاقة</label>
            <div class="input-wrapper">
                <img id="card-logo" src="" alt="logo">
                <input type="text" id="card-number" placeholder="رقم البطاقة" maxlength="19">
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>تاريخ نهاية الصلاحية</label>
                <input type="text" id="expiry" placeholder="MM/YY" maxlength="5">
            </div>
            <div class="input-group">
                <label>كود الأمان (CVV)</label>
                <input type="text" placeholder="820" maxlength="3">
            </div>
        </div>

        <div class="input-group">
            <label>اسم حامل البطاقة</label>
            <input type="text" placeholder="BAHA BEKRI">
        </div>

        <button type="submit">تأكيد الدفع</button>

        <div class="security-note">
            🛡️ نتبع معيار أمان بيانات مجال بطاقات الدفع (PCI DSS) ونستخدم التشفير القياسي في المجال لحماية معلوماتك الشخصية.
        </div>
    </form>
</div>

<script>
    const cardInput = document.getElementById('card-number');
    const cardLogo = document.getElementById('card-logo');
    const expiryInput = document.getElementById('expiry');

    // كاشف نوع البطاقة تلقائياً
    cardInput.addEventListener('input', function(e) {
        let val = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        let formatted = "";
        for (let i = 0; i < val.length; i++) {
            if (i > 0 && i % 4 == 0) formatted += " ";
            formatted += val[i];
        }
        e.target.value = formatted;

        // تحديد الشعار
        if (val.startsWith('4')) {
            cardLogo.src = 'https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg';
            cardLogo.style.display = 'block';
        } else if (val.startsWith('5')) {
            cardLogo.src = 'https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg';
            cardLogo.style.display = 'block';
        } else if (val.startsWith('6')) {
            cardLogo.src = 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Mada_Logo.svg';
            cardLogo.style.display = 'block';
        } else {
            cardLogo.style.display = 'none';
        }
    });

    // تنسيق التاريخ
    expiryInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 2) {
            e.target.value = value.substring(0, 2) + '/' + value.substring(2, 4);
        } else {
            e.target.value = value;
        }
    });
</script>

</body>
</html>
