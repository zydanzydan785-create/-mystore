<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h2 { font-size: 19px; font-weight: 500; margin: 0 auto; }
        
        .card-selection {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        
        .card-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            color: #757575;
            font-size: 14px;
        }
        .card-icons img { height: 14px; filter: grayscale(1); opacity: 0.6; }

        .input-container {
            position: relative;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
        }
        
        input {
            width: 100%;
            border: none;
            outline: none;
            padding: 10px 0;
            font-size: 18px;
            color: #333;
            background: transparent;
        }

        .label-floated {
            position: absolute;
            left: 0;
            top: -15px;
            font-size: 13px;
            color: #757575;
        }

        .row { display: flex; gap: 30px; }
        .row .input-container { flex: 1; }

        #dynamic-logo {
            width: 35px;
            transition: 0.2s;
            display: none;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            margin-top: 20px;
            font-size: 16px;
            color: #444;
        }
        .checkbox-row input { width: 22px; height: 22px; accent-color: #e31b23; }

        .pci-box {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            color: #888;
            font-size: 13px;
            line-height: 1.4;
            background: #fbfbfb;
            padding: 10px;
        }

        button {
            width: 100%;
            background: #000;
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>&times;</span>
        <h2>إتمام عملية الشراء</h2>
    </div>

    <div class="card-selection">بطاقة ائتمان/خصم</div>
    
    <div class="card-icons">
        رقم البطاقة
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Mada_Logo.svg">
    </div>

    <form>
        <div class="input-container">
            <input type="text" id="cn" placeholder="9043 7367 4004 5124" maxlength="19">
            <img id="dynamic-logo" src="">
        </div>

        <div class="row">
            <div class="input-container">
                <span class="label-floated">تاريخ نهاية الصلاحية</span>
                <input type="text" id="exp" placeholder="07/29" maxlength="5">
            </div>
            <div class="input-container">
                <span class="label-floated">كود الأمان ⓘ</span>
                <input type="text" placeholder="820" maxlength="3">
            </div>
        </div>

        <div class="input-container">
            <span class="label-floated">اسم حامل البطاقة</span>
            <input type="text" placeholder="BAHA BEKRI">
        </div>

        <div class="checkbox-row">
            <input type="checkbox" checked>
            <span>حفظ المعلومات لاستخدامها في المستقبل</span>
        </div>

        <div class="pci-box">
            <span>🛡️</span>
            <div>نتبع معيار أمان بيانات مجال بطاقات الدفع (PCI DSS) ونستخدم التشفير القياسي في المجال لحماية معلوماتك الشخصية.</div>
        </div>

        <button type="button">دفع الآن</button>
    </form>

    <script>
        const cn = document.getElementById('cn');
        const logo = document.getElementById('dynamic-logo');
        const exp = document.getElementById('exp');

        cn.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\s+/g, '');
            e.target.value = v.replace(/(.{4})/g, '$1 ').trim();
            
            if(v.startsWith('4')) { logo.src='https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg'; logo.style.display='block'; }
            else if(v.startsWith('5')) { logo.src='https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg'; logo.style.display='block'; }
            else if(v.startsWith('6')) { logo.src='https://upload.wikimedia.org/wikipedia/commons/b/b1/Mada_Logo.svg'; logo.style.display='block'; }
            else { logo.style.display='none'; }
        });

        exp.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if(v.length > 2) e.target.value = v.slice(0,2) + '/' + v.slice(2,4);
        });
    </script>
</body>
</html>
