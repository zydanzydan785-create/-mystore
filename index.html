<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام عملية الشراء</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h2 { font-size: 1.2rem; margin: 0; width: 100%; text-align: center; }
        .back-arrow { font-size: 1.5rem; cursor: pointer; position: absolute; right: 20px; }

        .title { font-size: 1.4rem; font-weight: 500; margin-bottom: 5px; }
        
        .card-types { display: flex; gap: 5px; align-items: center; margin-bottom: 20px; font-size: 0.9rem; color: #666; }
        .card-types img { height: 12px; filter: grayscale(1); opacity: 0.5; }

        .input-group { margin-bottom: 30px; border-bottom: 1px solid #ccc; position: relative; padding-bottom: 5px; }
        .input-group label { display: block; font-size: 0.9rem; color: #666; margin-bottom: 5px; }
        
        .input-wrapper { display: flex; align-items: center; flex-direction: row-reverse; }
        input {
            width: 100%;
            border: none;
            padding: 8px 0;
            font-size: 1.1rem;
            outline: none;
            background: transparent;
            color: #333;
        }

        #card-logo { width: 35px; height: 22px; object-fit: contain; margin-left: 10px; opacity: 0; transition: 0.3s; }

        .row { display: flex; gap: 40px; }
        .row .input-group { flex: 1; }

        .save-info { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 20px; font-size: 1.1rem; }
        .save-info input[type="checkbox"] { width: 20px; height: 20px; accent-color: #d11; }

        .pci-note {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #888;
            line-height: 1.6;
            display: flex;
            gap: 10px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 50px; /* زر بيضاوي مثل التطبيقات الحديثة */
            font-size: 1.1rem;
            margin-top: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="back-arrow">›</span>
        <h2>إتمام عملية الشراء</h2>
    </div>

    <div class="title">بطاقة ائتمان/خصم</div>
    
    <div class="card-types">
        رقم البطاقة
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Mada_Logo.svg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/JCB_logo.svg">
    </div>

    <form>
        <div class="input-group">
            <div class="input-wrapper">
                <img id="card-logo" src="" alt="">
                <input type="text" id="card-number" placeholder="9043 7367 4004 5124" maxlength="19">
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>تاريخ نهاية الصلاحية</label>
                <input type="text" id="expiry" placeholder="07/29" maxlength="5">
            </div>
            <div class="input-group">
                <label>كود الأمان ⓘ</label>
                <input type="text" placeholder="820" maxlength="3">
            </div>
        </div>

        <div class="input-group">
            <label>اسم حامل البطاقة</label>
            <input type="text" placeholder="BAHA BEKRI">
        </div>

        <div class="save-info">
            <span>حفظ المعلومات لاستخدامها في المستقبل</span>
            <input type="checkbox" checked>
        </div>

        <div class="pci-note">
            <span>🔒</span>
            <span>نتبع معيار أمان بيانات مجال بطاقات الدفع (PCI DSS) ونستخدم التشفير القياسي في المجال لحماية معلوماتك الشخصية.</span>
        </div>

        <button type="submit">دفع الآن</button>
    </form>

<script>
    const cardInput = document.getElementById('card-number');
    const cardLogo = document.getElementById('card-logo');
    const expiryInput = document.getElementById('expiry');

    cardInput.addEventListener('input', function(e) {
        let val = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        let formatted = "";
        for (let i = 0; i < val.length; i++) {
            if (i > 0 && i % 4 == 0) formatted += " ";
            formatted += val[i];
        }
        e.target.value = formatted;

        if (val.startsWith('4')) {
            cardLogo.src = 'https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg';
            cardLogo.style.opacity = '1';
        } else if (val.startsWith('5')) {
            cardLogo.src = 'https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg';
            cardLogo.style.opacity = '1';
        } else if (val.startsWith('6')) {
            cardLogo.src = 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Mada_Logo.svg';
            cardLogo.style.opacity = '1';
        } else {
            cardLogo.style.opacity = '0';
        }
    });

    expiryInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 2) {
            e.target.value = value.substring(0, 2) + '/' + value.substring(2, 4);
        } else {
            e.target.value = value;
        }
    });
</script>

</body>
</html>
